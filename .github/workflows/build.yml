name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned: a package carries the runtime of the CLI that built it, so the
  # installers are given the exact release the app is developed against.
  NSH_VERSION: v0.5.1

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION="$NSH_VERSION" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Type check
        run: nsh check

      - name: Bundle (read every warning)
        run: nsh build

      # The package and the release both ship this archive; fail early when the
      # extension files do not pack (a missing icon, a manifest Chrome refuses).
      - name: Build the browser extension archive
        run: |
          set -euo pipefail
          trap 'bash tools/build-extension.sh --reset' EXIT
          bash tools/build-extension.sh
          python3 - <<'PY'
          import json, zipfile
          archive = zipfile.ZipFile("vendor/extension/Downloader-extension.zip")
          names = set(archive.namelist())
          for required in ("Downloader-extension/manifest.json", "Downloader-extension/background.js", "Downloader-extension/popup.html"):
              assert required in names, f"{required} is missing from {sorted(names)}"
          icons = [name for name in names if name.startswith("Downloader-extension/icons/")]
          assert icons, "the archive carries no icons"
          manifest = json.loads(archive.read("Downloader-extension/manifest.json"))
          assert manifest["manifest_version"] == 3
          assert manifest["version"], "the manifest has no version"
          print(f"{len(names)} files, extension {manifest['version']}")
          PY

      - name: Headless tests
        run: nsh test --junit junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml
          if-no-files-found: ignore

  package:
    name: Package ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: macos
            arch: arm64
            nsh_arch: aarch64
            package_args: --arch arm64
          - name: macos-x86_64
            os: macos-15-intel
            target: macos
            arch: x86_64
            nsh_arch: x86_64
            package_args: --arch x86_64
          - name: linux-x86_64
            os: ubuntu-24.04
            target: linux
            arch: x86_64
            nsh_arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: linux
            arch: aarch64
            nsh_arch: aarch64
          - name: windows-x86_64
            os: windows-2022
            target: windows
            arch: x86_64
            nsh_arch: x86_64
            aria2_triple: windows-x86_64
          - name: windows-aarch64
            os: windows-11-arm
            target: windows
            arch: aarch64
            nsh_arch: aarch64
            # The official file is x86_64; Windows on Arm runs it under x64 emulation.
            aria2_triple: windows-arm64
          - name: web
            os: ubuntu-24.04
            target: web
            arch: ""
            nsh_arch: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install NSH (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION="$NSH_VERSION" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install NSH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # The workflow's NSH_VERSION env reaches the installer through $env.
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(python3 -c 'import json;print(json.load(open("nsh.json"))["version"])')"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base}+g$(git rev-parse --short HEAD)"
          fi
          num_version="${version%%+*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "num_version=$num_version" >> "$GITHUB_OUTPUT"
          echo "Building $version (version field $num_version)"

      - name: Install the aria2 tooling (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y aria2 patchelf file

      # One entry point: it prepares the target's sidecar, keeps other targets'
      # out of the asset list, packages, and restores the committed stub.
      # `SKIP_SIGN`: a certificate made fresh on every runner is a new identity
      # each release, so it would not keep the macOS Downloads grant anyway. The
      # stable identity is for local builds (`tools/package.sh macos`); release
      # signing needs a certificate persisted in secrets.
      - name: Package
        shell: bash
        env:
          ARIA2_TRIPLE: ${{ matrix.aria2_triple }}
          SKIP_SIGN: ${{ matrix.target == 'macos' && '1' || '0' }}
        run: |
          set -euo pipefail
          bash tools/package.sh "${{ matrix.target }}" \
            --out dist \
            --app-version "${{ steps.version.outputs.num_version }}" \
            --build "${GITHUB_RUN_NUMBER}" \
            ${{ matrix.package_args }}
          # No pipes into head here: with `pipefail`, a closed pipe would fail the step.
          ls -l dist
          du -sh dist/* 2>/dev/null || true

      - name: Check the bundled aria2c (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          exe=$(find dist -name 'aria2c.exe' -print -quit)
          test -n "$exe"
          "$exe" --version

      # The sidecar's libraries are bundled with `$ORIGIN` rpaths, so running it
      # here is the same check a user's first download makes.
      - name: Check the bundled aria2c (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find dist -name 'aria2.tar.gz' -print -quit)
          test -n "$archive"
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          tar -xzf "$archive" -C "$dir"
          "$dir/aria2c" --version

      - name: Archive macOS app
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Downloader.app" \
            "dist/Downloader-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.zip"
          rm -rf "dist/Downloader.app"

      # `nsh package` writes the updater archive next to the portable app; it is
      # the file `nsh update-manifest` reads, so keep it and drop the duplicate.
      # nsh writes `x64compatible` for both builds, so each installer could be
      # installed on the other architecture and leave an executable Windows
      # cannot start (0xc000007b). Match the installer to its runner, and ship
      # the MSVC runtime the prebuilt runner imports (vcruntime140[_1].dll):
      # Windows does not include it, and a wrong-architecture copy in PATH is
      # another 0xc000007b.
      - name: Bundle the C++ runtime and match the installer to its architecture (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $nshArch = '${{ matrix.nsh_arch }}'
          $dist = (Resolve-Path 'dist').Path
          $app = Join-Path $dist 'Downloader'
          $iss = Join-Path $dist 'Downloader.iss'
          if (-not (Test-Path $iss)) { throw "missing $iss" }

          $vsArch = if ($nshArch -eq 'aarch64') { 'arm64' } else { 'x64' }
          $runtimeDlls = if ($vsArch -eq 'arm64') { @('vcruntime140.dll') } else { @('vcruntime140.dll', 'vcruntime140_1.dll') }
          $expectedMachine = if ($vsArch -eq 'arm64') { 0xAA64 } else { 0x8664 }

          function Get-PeMachine([string]$path) {
            $stream = [IO.File]::OpenRead($path)
            try {
              $reader = [IO.BinaryReader]::new($stream)
              $stream.Position = 0x3C
              $pe = $reader.ReadInt32()
              $stream.Position = $pe + 4
              return $reader.ReadUInt16()
            } finally {
              $stream.Dispose()
            }
          }

          # Windows does not ship vcruntime140, and on Arm64 the x64 redist's copy
          # can sit in the search path. Take the native runtime from System32,
          # installing the official redist first when it is absent.
          $system32 = Join-Path $env:SystemRoot 'System32'
          $needInstall = $false
          foreach ($dll in $runtimeDlls) {
            $path = Join-Path $system32 $dll
            if (-not (Test-Path $path) -or (Get-PeMachine $path) -ne $expectedMachine) {
              $needInstall = $true
            }
          }
          if ($needInstall) {
            Write-Host "installing the $vsArch Visual C++ runtime"
            $url = if ($vsArch -eq 'arm64') { 'https://aka.ms/vs/17/release/vc_redist.arm64.exe' } else { 'https://aka.ms/vs/17/release/vc_redist.x64.exe' }
            $installer = Join-Path $env:TEMP 'vc_redist.exe'
            Invoke-WebRequest -Uri $url -OutFile $installer
            $process = Start-Process -FilePath $installer -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
            if ($process.ExitCode -notin @(0, 1638, 3010)) { throw "vc_redist failed with $($process.ExitCode)" }
          }
          foreach ($dll in $runtimeDlls) {
            $source = Join-Path $system32 $dll
            if (-not (Test-Path $source)) { throw "missing $source" }
            if ((Get-PeMachine $source) -ne $expectedMachine) { throw "$source is not a $vsArch binary" }
            Copy-Item -Path $source -Destination $app -Force
            Write-Host "bundled $dll from $source"
          }

          $update = Join-Path $dist "Downloader-${{ steps.version.outputs.num_version }}-windows-$nshArch.zip"
          if (-not (Test-Path $update)) { throw "missing $update" }
          Compress-Archive -Path $app -DestinationPath $update -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($update)
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') }
            foreach ($dll in $runtimeDlls) {
              if ($names -notcontains "Downloader/$dll") { throw "$update lacks Downloader/$dll" }
            }
          } finally {
            $archive.Dispose()
          }
          Write-Host "rebuilt $update with the C++ runtime"

          if ($nshArch -eq 'aarch64') {
            $allowed = 'arm64'
            $installMode = 'arm64'
          } else {
            $allowed = 'x64compatible and not arm64'
            $installMode = 'x64compatible'
          }
          $lines = Get-Content $iss | ForEach-Object {
            if ($_ -match '^ArchitecturesAllowed=') { "ArchitecturesAllowed=$allowed" }
            elseif ($_ -match '^ArchitecturesInstallIn64BitMode=') { "ArchitecturesInstallIn64BitMode=$installMode" }
            else { $_ }
          }
          Set-Content -Path $iss -Value $lines -Encoding utf8
          Get-Content $iss | Select-String '^Architectures'

          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "${env:ProgramFiles}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'ISCC.exe not found, though nsh package compiled the installer' }
          Push-Location dist
          try {
            # Inno's default output is .\Output; write beside the portable app
            # instead, so the release uploads and renames the recompiled one.
            & $iscc "/O$dist" 'Downloader.iss'
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          Remove-Item -Recurse -Force (Join-Path $dist 'Output') -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $dist 'Downloader-setup.exe'))) { throw 'ISCC wrote no installer' }

      - name: Keep the Windows update archive
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          arch_label="${{ matrix.nsh_arch }}"
          if [ "$arch_label" = "aarch64" ]; then arch_label="arm64"; fi
          update="dist/Downloader-${{ steps.version.outputs.num_version }}-windows-${{ matrix.nsh_arch }}.zip"
          test -f "$update"
          # Both architectures write these two names; a merged artifact download
          # would keep only one, so name the installer for its architecture.
          if [ -f "dist/Downloader-setup.exe" ]; then
            mv "dist/Downloader-setup.exe" "dist/Downloader-$version-windows-$arch_label-setup.exe"
          fi
          rm -f "dist/Downloader.iss"
          rm -rf "dist/Downloader" "dist/Downloader.zip"
          test -f "$update"

      - name: Keep the Linux update archive
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          update="dist/Downloader-${{ steps.version.outputs.num_version }}-linux-${{ matrix.nsh_arch }}.tar.gz"
          test -f "$update"
          rm -rf "dist/Downloader" "dist/Downloader.tar.gz"
          test -f "$update"

      - name: Archive web site
        if: matrix.target == 'web'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -qr "Downloader-${{ steps.version.outputs.version }}-web.zip" Downloader
          rm -rf Downloader

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: downloader-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Engine end-to-end (macOS host)
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION="$NSH_VERSION" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install aria2
        run: brew install aria2

      # Real downloads, HLS segments, a proxy, and a BitTorrent swarm on this
      # machine: the script serves the fixtures, grants /tmp for the run, and
      # restores nsh.json afterwards.
      - name: Run engine tests
        run: bash tools/run-e2e.sh

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION="$NSH_VERSION" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          pattern: downloader-*
          path: dist
          merge-multiple: true

      # `nsh update-manifest` reads nsh.json, so the tag and its version must agree.
      - name: Verify the release version
        shell: bash
        run: |
          set -euo pipefail
          base="$(python3 -c 'import json;print(json.load(open("nsh.json"))["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$base" != "$tag" ]; then
            echo "nsh.json 的 version 是 $base，tag 是 $tag；先同步版本再发布。" >&2
            exit 1
          fi

      # The release ships the package artifacts only; the test report stays with its job.
      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          changes="$RUNNER_TEMP/changes.md"
          {
            echo "### 变更"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous..$GITHUB_REF_NAME"
            else
              git log --no-merges --pretty='- %s' -40
            fi
          } > "$changes"
          {
            echo "## ${GITHUB_REF_NAME}"
            echo
            echo "Downloader 桌面版：macOS（Apple 芯片 / Intel）、Windows（x86_64 / arm64）、Linux（x86_64 / aarch64），另附网页预览版。"
            echo
            echo "- 浏览器扩展：下载 \`Downloader-extension.zip\`（https://github.com/aafnnp/nsh-downloader/releases/latest/download/Downloader-extension.zip），解压后在 chrome://extensions 用「加载已解压的扩展程序」指向 \`Downloader-extension/\`；应用「设置 → 浏览器集成」里也能直接下载。"
            echo "- macOS 包为临时签名，首次打开请右键 → 打开。"
            echo "- Windows x64 下载 \`windows-x86_64\`，Windows on Arm 下载 \`windows-arm64\`；自动更新包里的 Arm64 名为 \`windows-aarch64\`。"
            echo "- Windows 包已附带对应的 Microsoft Visual C++ 运行库；启动提示 0xc000007b 通常是装错了架构。"
            echo "- 应用内更新读取这个 Release 的 \`latest.json\`。"
            echo
            cat "$changes"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # The manifest names the same archives the release ships; unsigned is fine
      # because `updater.github` trusts only this repository's releases.
      - name: Generate the update manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archives=(
            "dist/Downloader-$version-macos-aarch64.tar.gz"
            "dist/Downloader-$version-macos-x86_64.tar.gz"
            "dist/Downloader-$version-linux-aarch64.tar.gz"
            "dist/Downloader-$version-linux-x86_64.tar.gz"
            "dist/Downloader-$version-windows-aarch64.zip"
            "dist/Downloader-$version-windows-x86_64.zip"
          )
          for archive in "${archives[@]}"; do
            if [ ! -f "$archive" ]; then
              echo "缺少自动更新包：$archive" >&2
              exit 1
            fi
          done
          nsh update-manifest "${archives[@]}" \
            --notes "$RUNNER_TEMP/changes.md" \
            -o dist
          cat dist/latest.json

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Downloader ${GITHUB_REF_NAME#v}" \
              --notes-file "$notes"
          fi
